[package]
name = "bare"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
winresource = "0.1"

[dependencies]
wry = "0.57"
tao = "0.37"
adblock = { package = "adblock", version = "0.13.5", features = ["resource-assembler", "css-validation"], default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
url = "2"
ureq = { version = "3", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_System_Com"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
